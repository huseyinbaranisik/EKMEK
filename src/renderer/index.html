<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ekmek AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stiller.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" id="ana-konteyner">
        <!-- Sürükleme Alanı -->
        <div class="drag-handle"></div>

        <!-- Kapat Butonu -->
        <button id="kapat-btn" class="kapat-btn" title="Kapat">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
        
        <!-- Başlık Bölümü -->
        <div class="header">
            <h1>EKMEK</h1>
            <p id="status-text">Hazırlanıyor...</p>
        </div>

        <!-- ===================== MİKROFON MODU ===================== -->
        <div id="mikrofon-modu" class="mod-alani">
            <!-- Asistan Görseli ve Yanıt Alanı -->
            <div class="assistant-ui">
                <div class="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <div id="response-text" class="response-area">
                    Size nasıl yardımcı olabilirim efendim?
                </div>
            </div>

            <!-- Kontrol Butonları -->
            <div class="controls">
                <button id="mic-btn" class="mic-button" title="Mikrofon">
                    <svg viewBox="0 0 24 24" width="32" height="32">
                        <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <!-- Chat moduna geçiş ikonu -->
                <button id="chat-gec-btn" class="mod-gecis-btn" title="Chat moduna geç">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- ===================== CHAT MODU ===================== -->
        <div id="chat-modu" class="mod-alani chat-gizli">
            <!-- Chat Mesaj Listesi -->
            <div id="chat-listesi" class="chat-listesi">
                <div class="chat-karsilama">
                    <span>Merhaba! Size nasıl yardımcı olabilirim efendim?</span>
                </div>
            </div>

            <!-- Instagram tarzı mesaj giriş alanı -->
            <div class="chat-giris-alani">
                <input 
                    type="text" 
                    id="chat-girisi" 
                    class="chat-input" 
                    placeholder="Bir mesaj yazın..."
                    autocomplete="off"
                />
                <button id="gonder-btn" class="gonder-btn" title="Gönder">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>

            <!-- Mikrofon moduna geri dön ikonu -->
            <button id="mik-gec-btn" class="mod-gecis-btn" title="Mikrofon moduna geç">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Uygulama Mantığı -->
    <script src="arayuz_sureci.js"></script>
</body>
</html>
